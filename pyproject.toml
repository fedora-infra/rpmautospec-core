[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpmautospec-core"
version = "0.3.0"
description = "Core functionality for rpmautospec"
authors = [{ name = "Nils Philippsen", email = "nils@redhat.com" }]
requires-python = ">=3.6,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/fedora-infra/rpmautospec-core"

[dependency-groups]
dev = [
    "pytest<10,>=6.2.2",
    "pytest-cov<8,>=7.0.0 ; python_full_version >= '3.9' and python_full_version < '4'",
    "ruff<0.18.0,>=0.1.14 ; python_full_version >= '3.7' and python_full_version < '4'",
]

[tool.hatch.build.targets.wheel]
packages = ["rpmautospec_core"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "LICENSE",
    "DCO.txt",
    "pyproject.toml",
    "rpmautospec_core/**/*.py",
    "tests/**/*.py",
    "tests/test-specfiles/*.spec",
    "tox.ini",
]

[tool.black]
line_length = 100

[tool.pytest.ini_options]
addopts = "--cov --cov-config .coveragerc --cov-report term --cov-report xml --cov-report html"

[tool.ruff]
line-length = 100
target-version = "py37"  # Really 3.6, but ruff's floor is 3.7

[tool.ruff.lint]
ignore = ["FA100"]  # typing.Dict/Union needed for Python 3.6 compat

